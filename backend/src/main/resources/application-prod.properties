
# Production application configuration
spring.application.name=LocalWorker

# Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server
server.port=${PORT:8080}

# Frontend
app.frontend-url=${FRONTEND_URL}

# File storage
app.file.upload-dir=${FILE_UPLOAD_DIR:uploads}

# JWT
jwt.secret=${JWT_SECRET}

# Refresh token expiration (7 days)
app.auth.refresh-token-expiration-ms=604800000

# Actuator Health Check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false


# Google OAuth
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Email - Resend
# Gmail SMTP Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}


# Production email provider
app.email.provider=google-script
app.mail.from=${SPRING_MAIL_USERNAME}

# Google Apps Script
app.google-script.url=${GOOGLE_SCRIPT_URL}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

